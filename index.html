<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정서적자활 진행 도구 (검수용)</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2a26;--sub:#5d6a64;--line:#dcdfd8;--main:#1f7a55;--main-ink:#fff;--soft:#e6f2ec;--warn:#a85b00;--warn-bg:#fff4e0;--bad:#b3261e;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1d2421;--ink:#e8eeea;--sub:#9fada6;--line:#33403a;--main:#4fbf8f;--main-ink:#0c1a14;--soft:#1f3329;--warn:#ffb95c;--warn-bg:#3a2c12;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header.top{background:var(--main);color:var(--main-ink);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top a{color:inherit;text-decoration:none}
header.top .brand{font-weight:700;font-size:17px;margin-right:auto}
header.top nav a{padding:6px 10px;border-radius:8px;font-size:15px}
header.top nav a.on{background:rgba(255,255,255,.22)}
main{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:19px;margin:22px 0 8px}h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--main)}
.no{display:inline-block;background:var(--main);color:var(--main-ink);border-radius:6px;padding:0 8px;font-weight:700;margin-right:6px}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:1px 10px;font-size:13px;margin:2px 4px 2px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:12px 0}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--sub);border-radius:8px 8px 0 0}
.tabs a.on{background:var(--main);color:var(--main-ink)}
button,.btn{font:inherit;border:1px solid var(--main);background:var(--main);color:var(--main-ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--main)}
button.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:70px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.scroll{overflow-x:auto}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
.stage{border-left:5px solid var(--main);padding-left:12px;margin:14px 0}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item input[type=checkbox]{width:20px;height:20px;margin-top:4px;flex:none}
.item .min{flex:none;width:58px;text-align:center}
.item .min button{padding:2px 6px;font-size:13px;width:100%}
.item ul{margin:4px 0 0;padding-left:18px;color:var(--sub);font-size:14px}
.meta{font-size:13px;color:var(--sub)}
.timer{position:sticky;top:52px;z-index:4;background:var(--card);border:2px solid var(--main);border-radius:var(--r);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;min-width:86px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pages a{border:1px solid var(--line);border-radius:6px;overflow:hidden;display:block;background:#fff;text-align:center;font-size:12px;color:#333;text-decoration:none}
.pages img{width:100%;display:block}
.p1{background:#fde7e4;color:#a3271d}.p2{background:var(--warn-bg);color:var(--warn)}.p3{background:var(--line);color:var(--sub)}.ok{background:var(--main);color:var(--main-ink)}
.q label{display:block;padding:4px 0}.q textarea{min-height:54px}.steps{padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;padding:6px 0 6px 40px;position:relative}.steps li:before{content:counter(s);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--main);color:var(--main-ink);text-align:center;font-weight:700}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--main)}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 12px;background:transparent;color:var(--ink);border:1px solid var(--line)}.opt:hover{border-color:var(--main)}.opt.on{background:var(--soft);border:2px solid var(--main);font-weight:700}
.qgrid{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.qgrid .th{flex:none;width:170px;font-size:12px;text-align:center;color:var(--sub);text-decoration:none}.qgrid .th img{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font-size:26px;line-height:1.3}.tile span{display:block}
details.card summary{cursor:pointer}
.bar{height:12px;background:var(--main);border-radius:6px;min-width:2px}
.bar.pre{background:var(--sub)}
.att{cursor:pointer;text-align:center;user-select:none;min-width:38px}
.num{width:52px;text-align:center;padding:3px}
#printArea{display:none}
@media print{header.top,main{display:none!important}#printArea{display:block}#printArea img{width:100%;page-break-after:always}body{background:#fff;color:#000}#printArea table{font-size:12px}#printArea th{background:#eee}#printArea .rep{padding:0 6mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:600px){.item .min{width:48px}h1{font-size:20px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">정서적자활 진행 도구 <span style="font-weight:400;font-size:13px">검수용</span></a>
  <nav><a href="#/" data-n="home">과정</a><a href="#/run" data-n="run">운영 기록</a><a href="#/review" data-n="review">검수</a><a href="#/data" data-n="data">자료 관리</a></nav>
  <span id="sync" style="font-size:13px;width:100%;text-align:right"></span>
</header>
<main id="app"></main>
<div id="printArea"></div>
<script src="data.js"></script>
<script>
const G=window.GUIDE||{programs:[],front:{}};
const KEY='jeongseo-jahwal-v1';
let S=load();
function load(){try{return Object.assign({groups:[],reviews:[],rev:{},cur:'',me:{},ans:{},adm:{files:[],st:{}}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{groups:[],reviews:[],rev:{},cur:'',me:{},ans:{},adm:{files:[],st:{}}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('이 브라우저에 저장하지 못했습니다. 「자료 관리」에서 파일로 내려받아 두세요.')}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(q,el=document)=>el.querySelector(q);
const P=no=>G.programs.find(p=>p.no==no);
const pad=n=>String(n).padStart(3,'0');
const img=n=>`pages/p${pad(n)}.jpg`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
function pageThumbs(list){list=[...new Set(list||[])].sort((a,b)=>a-b);if(!list.length)return'';
  return `<div class="pages">${list.map(n=>`<a href="${img(n)}" target="_blank"><img loading="lazy" src="${img(n)}" alt="원본 ${n-2}쪽">책 ${n-2}쪽</a>`).join('')}</div>
  <p><button class="ghost" onclick='printPages(${JSON.stringify(list)})'>이 쪽들 인쇄</button></p>`}
function printPages(list){$('#printArea').innerHTML=list.map(n=>`<img src="${img(n)}">`).join('');const im=[...document.querySelectorAll('#printArea img')];let c=0;const go=()=>{if(++c>=im.length)window.print()};im.forEach(i=>{if(i.complete)go();else{i.onload=go;i.onerror=go}})}

/* ---------- 화면 나누기 ---------- */
window.addEventListener('hashchange',route);
function route(){stopTimer();const h=(location.hash||'#/').slice(2).split('/');const app=$('#app');
  document.querySelectorAll('header nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===(h[0]==='p'||!h[0]?'home':h[0]==='report'?(h[1]==='sample'?'review':'run'):h[0])));
  if(!G.programs.length){app.innerHTML='<div class="note">과정 자료(data.js)를 불러오지 못했습니다.</div>';return}
  if(!h[0])app.innerHTML=home();
  else if(h[0]==='p'&&h[2]==='s')app.innerHTML=session(P(h[1]),+h[3]);
  else if(h[0]==='p')app.innerHTML=program(P(h[1]),h[2]||'overview');
  else if(h[0]==='report')app.innerHTML=report(h[1],+h[2]);
  else if(h[0]==='run'&&h[1])app.innerHTML=group(h[1],h[2]);
  else if(h[0]==='run')app.innerHTML=runList();
  else if(h[0]==='review')app.innerHTML=h[1]==='p'?revProg(+h[2]):h[1]==='admin'?admin():review();
  else if(h[0]==='data')app.innerHTML=dataPage();
  window.scrollTo(0,0);showSync()}

/* ---------- 과정 목록 ---------- */
let filt={q:'',n:''};
function home(){const list=G.programs.filter(p=>(!filt.n||p.sessions.length==filt.n)&&(!filt.q||JSON.stringify([p.title,p.subtitle,p.overview]).includes(filt.q)));
  return `<h1>서울특화 정서적자활 프로그램</h1>
  <p class="sub">가이드북의 7개 과정을 회기 단위로 따라가며 진행·기록·평가할 수 있게 옮긴 검수용 도구입니다. 참여주민은 반드시 <b>사례관리번호(별칭)</b>로만 적습니다.</p>
  <div class="card row"><b>과정 고르기</b>
   <input placeholder="대상·낱말 (예: 청년, 게이트웨이, 1인가구)" value="${esc(filt.q)}" oninput="filt.q=this.value;$('#plist').innerHTML=cards()" style="flex:1;min-width:200px">
   <select onchange="filt.n=this.value;$('#plist').innerHTML=cards()"><option value="">회기 수 전체</option><option value="4"${filt.n==4?' selected':''}>4회기</option><option value="8"${filt.n==8?' selected':''}>8회기</option></select></div>
  <div class="grid" id="plist">${cards(list)}</div>`}
function cards(list){list=list||G.programs.filter(p=>(!filt.n||p.sessions.length==filt.n)&&(!filt.q||JSON.stringify([p.title,p.subtitle,p.overview]).includes(filt.q)));
  return list.map(p=>`<a class="card" href="#/p/${p.no}"><div><span class="no">${String(p.no).padStart(2,'0')}</span><b>${esc(p.title)}</b></div>
  <div class="sub">${esc(p.subtitle)}</div><p style="font-size:14px">${esc(p.overview.target)}</p>
  <span class="chip">${p.sessions.length}회기</span><span class="chip">${esc(p.overview.groupSize)}</span>
  <div class="meta">${(p.developers||[]).map(d=>esc(d.name+' · '+d.center)).join(', ')}</div></a>`).join('')||'<p class="sub">조건에 맞는 과정이 없습니다.</p>'}

/* ---------- 과정 ---------- */
function ptabs(p,t){const T=[['overview','개요'],['sessions','회기'],['eval','평가 척도'],['forms','양식·워크시트'],['notes','확인할 점']];
  return `<p class="sub"><a href="#/">과정</a> ›</p><h1><span class="no">${String(p.no).padStart(2,'0')}</span>${esc(p.title)}</h1><p class="sub">${esc(p.subtitle)} · ${(p.developers||[]).map(d=>esc(d.name+'('+d.center+')')).join(', ')} · 책 ${p.pdfPages[0]-2}~${p.pdfPages[1]-2}쪽</p>
  <div class="tabs">${T.map(x=>`<a class="${x[0]===t?'on':''}" href="#/p/${p.no}/${x[0]}">${x[1]}</a>`).join('')}</div>`}
function program(p,t){if(!p)return'<p>없는 과정입니다.</p>';const o=p.overview,e=p.evaluation||{};let b='';
  if(t==='overview')b=`<div class="card"><h3>대상</h3><p>${esc(o.target)}</p>${o.learnerTraits&&o.learnerTraits.length?`<h3>학습자 특성</h3><ul>${li(o.learnerTraits)}</ul>`:''}
    <p><span class="chip">시간 ${esc(o.hours)}</span><span class="chip">인원 ${esc(o.groupSize)}</span></p>
    <h3>학습 목표</h3><ul>${li(o.goals)}</ul><h3>교재·교보재</h3><p>${(o.materials||[]).map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</p>
    <h3>평가도구</h3><ul>${li(o.evalTools)}</ul></div>
    <div class="card"><h3>개발 배경</h3><p>${esc(p.background)}</p><p>${(p.theory||[]).map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</p><h3>회기 구성의 흐름</h3><p>${esc(p.flow)}</p></div>
    ${p.futureUse&&p.futureUse.length?`<div class="card"><h3>향후 활용</h3><ul>${li(p.futureUse)}</ul></div>`:''}
    ${p.testimonials?`<div class="card"><h3>활동기록·참여자 소감</h3><p>${esc(p.testimonials)}</p></div>`:''}`;
  if(t==='sessions')b=`<div class="scroll"><table><tr><th>회기</th><th>제목</th><th>핵심개념</th><th>목표</th><th>주요내용</th><th></th></tr>${p.sessions.map(s=>`<tr><td>${s.n}</td><td><b>${esc(s.title)}</b></td><td>${esc(s.concept)}</td><td>${esc(s.goal)}</td><td><ul style="margin:0;padding-left:16px">${li(s.mainItems)}</ul></td><td><a class="btn" href="#/p/${p.no}/s/${s.n}">진행판</a></td></tr>`).join('')}</table></div>`;
  if(t==='eval')b=(e.quant||[]).map((q,i)=>scaleCard(p,q,i)).join('')+((e.qual||[]).map(q=>`<div class="card"><h3>${esc(q.name)}</h3><p class="sub">${esc(q.when)}</p><ul>${li(q.questions)}</ul></div>`).join(''))||'<p class="sub">등록된 척도가 없습니다.</p>';
  if(t==='forms')b=`${(e.otherForms||[]).map(f=>`<div class="card"><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p>${f.fields&&f.fields.length?`<ul>${li(f.fields)}</ul>`:''}${pageThumbs([f.pdfPage].filter(Boolean))}</div>`).join('')}
    ${p.sessions.map(s=>{const w=(p.worksheets||[]).filter(x=>x.session==s.n);return w.length?`<h2>${s.n}회기 · ${esc(s.title)}</h2>${w.map(wsCard).join('')}`:''}).join('')}
    ${(p.worksheets||[]).filter(x=>!p.sessions.some(s=>s.n==x.session)).map(wsCard).join('')}`;
  if(t==='notes')b=`<div class="card"><h3>책에서 확인이 필요한 점</h3><p>책을 도구로 옮기면서 찾은 불일치·빠진 내용을 <b>${items(p.no).length}개 확인 항목</b>으로 정리했습니다. 이 가운데 ${items(p.no).filter(answered).length}개에 답하셨습니다.</p><p><a class="btn" href="#/review/p/${p.no}">확인 항목에 답하기</a> <a class="btn ghost" href="#/review">검수 안내 보기</a></p></div>
    <div class="card"><h3>사진·그림</h3><ul>${(p.photos||[]).map(x=>`<li><a href="${img(x.pdfPage)}" target="_blank">책 ${x.pdfPage-2}쪽</a> — ${esc(x.desc)}</li>`).join('')||'<li>없음</li>'}</ul></div>`;
  return ptabs(p,t)+b}
function wsCard(w){return `<div class="card"><b>${esc(w.title)}</b> <span class="chip">${esc(w.kind)}</span>${w.needsImage?'<span class="chip" style="background:var(--warn-bg);color:var(--warn)">원본 도안 필요</span>':''}
  ${w.prompts&&w.prompts.length?`<ul>${li(w.prompts)}</ul>`:''}${w.content?`<details><summary>원문 보기</summary><div style="white-space:pre-wrap;font-size:14px">${esc(typeof w.content==='string'?w.content:Array.isArray(w.content)?w.content.map(x=>typeof x==='string'?x:JSON.stringify(x,null,1)).join('\n'):JSON.stringify(w.content,null,1))}</div></details>`:''}${w.note?`<p class="sub">${esc(w.note)}</p>`:''}${pageThumbs(w.pdfPages)}</div>`}
function revKey(p,i){return p.no+'-'+i}
function revOf(p,q,i){const o=S.rev[revKey(p,i)];return q.items.map((it,k)=>o?!!o[k]:it.reverse===true)}
function revUnknown(p,q,i){return !S.rev[revKey(p,i)]&&q.items.some(it=>it.reverse==null)}
function scaleCard(p,q,i){const r=revOf(p,q,i);
  return `<div class="card"><h3>${esc(q.name)} ${q.abbr?`<span class="chip">${esc(q.abbr)}</span>`:''}</h3>
  <p class="sub">${esc(q.when)} · ${q.points}점 척도 (${(q.labels||[]).map(esc).join(' / ')}) · 책 ${q.pdfPage?q.pdfPage-2:'?'}쪽</p>
  ${q.instruction?`<p>${esc(q.instruction)}</p>`:''}
  ${revUnknown(p,q,i)?'<div class="note">책에 역채점 문항이 적혀 있지 않습니다. 지금은 단순 합계로 계산합니다. 아래 「역」 칸을 표시하면 그 문항은 거꾸로 채점됩니다(개발자 확인 필요).</div>':''}
  <div class="scroll"><table><tr><th>번호</th><th>문항</th><th title="역채점">역</th></tr>${q.items.map((it,k)=>`<tr><td>${it.n}</td><td>${esc(it.text)}</td><td><input type="checkbox" ${r[k]?'checked':''} onchange="setRev(${p.no},${i},${k},this.checked)"></td></tr>`).join('')}</table></div>
  ${q.subscales?`<p class="sub">하위영역: ${esc(q.subscales)}</p>`:''}${q.scoring?`<p class="sub">채점·해석: ${esc(q.scoring)}</p>`:''}
  <p class="row"><button class="ghost" onclick="printScale(${p.no},${i})">설문지 인쇄</button>${q.pdfPage?`<a class="btn ghost" target="_blank" href="${img(q.pdfPage)}">원본 쪽 보기</a>`:''}</p></div>`}
function setRev(no,i,k,v){const p=P(no),q=p.evaluation.quant[i];const cur=revOf(p,q,i);cur[k]=v;S.rev[revKey(p,i)]=cur;save();push({t:'rev',val:S.rev})}
function printScale(no,i){const p=P(no),q=p.evaluation.quant[i];
  $('#printArea').innerHTML=`<h2>${esc(q.name)}</h2><p>사례관리번호: ____________ &nbsp; □ 사전 □ 사후 &nbsp; 날짜: ____________</p><p>${esc(q.instruction||'')}</p>
  <table><tr><th>번호</th><th>문항</th>${(q.labels||[]).map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${q.items.map(it=>`<tr><td>${it.n}</td><td>${esc(it.text)}</td>${(q.labels||[]).map(()=>'<td style="text-align:center">□</td>').join('')}</tr>`).join('')}</table><p>본 설문은 프로그램 평가의 목적으로만 사용됩니다.</p>`;window.print()}

/* ---------- 회기 진행판 ---------- */
let long=false,tm=null,left=0,tlabel='';
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function mm(m){return m==null?null:(long?Math.round(m*1.5/5)*5:m)}
function startTimer(m,label){stopTimer();left=m*60;tlabel=label;tick();tm=setInterval(()=>{left--;tick();if(left<=0){stopTimer(true)}},1000)}
function tick(){const t=$('#tnow'),l=$('#tlab');if(t)t.textContent=fmt(left);if(l)l.textContent=tlabel}
function stopTimer(done){if(tm){clearInterval(tm);tm=null}if(done){const l=$('#tlab');if(l)l.textContent=tlabel+' — 시간이 다 됐습니다';try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.6)}catch(e){}}}
function curGroup(no){return S.groups.find(g=>g.id===S.cur&&g.prog==no)}
function session(p,n){const s=p&&p.sessions.find(x=>x.n==n);if(!s)return'<p>없는 회기입니다.</p>';const g=curGroup(p.no);const gs=S.groups.filter(x=>x.prog==p.no);
  const done=(g&&g.done&&g.done[n])||{};const prev=p.sessions.find(x=>x.n==n-1);const total=s.stages.reduce((a,st)=>a+(mm(st.minutes)||0),0);
  const ws=(p.worksheets||[]).filter(w=>w.session==n);
  return `<p class="sub"><a href="#/">과정</a> › <a href="#/p/${p.no}/sessions">${esc(p.title)}</a> ›</p>
  <h1>${n}회기 · ${esc(s.title)}</h1><p><span class="chip">${esc(s.concept)}</span> ${esc(s.goal)}</p>
  <div class="card row"><label>운영 집단 <select onchange="S.cur=this.value;save();route()"><option value="">(기록 안 함 — 미리 보기)</option>${gs.map(x=>`<option value="${x.id}"${g&&g.id===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label><input type="checkbox" ${long?'checked':''} onchange="long=this.checked;route()"> 3시간 운영안</label>
    <span class="sub">합계 ${total}분</span>
    ${n>1?`<a class="btn ghost" href="#/p/${p.no}/s/${n-1}">← 이전</a>`:''}${n<p.sessions.length?`<a class="btn ghost" href="#/p/${p.no}/s/${n+1}">다음 →</a>`:''}</div>
  ${long?'<div class="note">3시간 운영안은 책의 2시간 시간표를 1.5배로 늘려 5분 단위로 맞춘 <b>임시 배분</b>입니다. 늘어난 시간을 어디에 쓸지는 개발자 의견을 받아 확정합니다.</div>':''}
  ${g?'':'<div class="note">운영 집단을 고르면 진행 체크·출석·메모가 저장됩니다. 집단은 「운영 기록」에서 만듭니다.</div>'}
  <div class="timer"><b id="tnow">00:00</b><span id="tlab" class="sub">항목 옆 「○분」을 누르면 시간을 잽니다</span><button class="ghost" onclick="stopTimer()">멈춤</button></div>
  <div class="card"><h3>준비물</h3><p>${[...new Set(s.stages.flatMap(st=>st.items.map(i=>i.materials)).filter(Boolean).flatMap(x=>String(x).split(/[,،、\n]/)).map(x=>x.trim()).filter(Boolean))].map(m=>`<span class="chip">${esc(m)}</span>`).join('')||'<span class="sub">책에 따로 적힌 준비물 없음</span>'}</p>
  ${prev&&prev.homework&&prev.homework.length?`<h3>지난 회기 과제 점검</h3><ul>${li(prev.homework)}</ul>`:''}</div>
  ${s.stages.map((st,a)=>`<div class="stage"><h2>${esc(st.stage)} <span class="sub">${mm(st.minutes)!=null?mm(st.minutes)+'분':''}</span></h2>
    ${st.items.map((it,b)=>{const k=a+'-'+b;return `<div class="item"><input type="checkbox" ${done[k]?'checked':''} ${g?'':'disabled'} onchange="setDone(${p.no},${n},'${k}',this.checked)">
      <div class="min">${it.minutes!=null?`<button class="ghost" onclick='startTimer(${mm(it.minutes)},${JSON.stringify(String(it.text).slice(0,30))})'>${mm(it.minutes)}분</button>`:''}</div>
      <div><div>${esc(it.text)}</div>${it.sub&&it.sub.length?`<ul>${li(it.sub)}</ul>`:''}<div class="meta">${[it.method,it.materials].filter(Boolean).map(esc).join(' · ')}</div></div></div>`}).join('')}</div>`).join('')}
  ${s.homework&&s.homework.length?`<div class="card"><h3>이번 회기 과제</h3><ul>${li(s.homework)}</ul></div>`:''}
  ${s.tip?`<div class="card"><h3>과정 안내 및 운영의 TIP</h3><p>${esc(s.tip)}</p></div>`:''}
  ${ws.length||(s.worksheetPdfPages||[]).length?`<h2>이 회기 워크시트</h2>${ws.map(wsCard).join('')||pageThumbs(s.worksheetPdfPages)}`:''}
  ${g?`<div class="card"><h3>회기 기록 — ${esc(g.name)}</h3><div class="row"><label>진행일 <input type="date" value="${esc((g.log[n]||{}).date||'')}" onchange="setLog('${g.id}',${n},'date',this.value)"></label><a class="btn ghost" href="#/run/${g.id}">출석·관찰 기록 열기</a></div>
    <p><textarea placeholder="회기 운영 메모 (잘된 점, 어려웠던 점, 다음에 바꿀 점). 이름 대신 사례관리번호로 적습니다." onchange="setLog('${g.id}',${n},'memo',this.value)">${esc((g.log[n]||{}).memo||'')}</textarea></p></div>`:''}
  <div class="card"><h3>검수 의견 남기기</h3><div class="row"><input id="rvwho" placeholder="적는 사람" style="width:140px"><input id="rvtx" placeholder="이 회기에서 고칠 점·보탤 점" style="flex:1;min-width:200px"><button onclick="addReview(${p.no},${n})">남기기</button></div></div>`}
function setDone(no,n,k,v){const g=curGroup(no);if(!g)return;g.done=g.done||{};g.done[n]=g.done[n]||{};g.done[n][k]=v;save()}
function setLog(id,n,f,v){const g=S.groups.find(x=>x.id===id);g.log[n]=g.log[n]||{};g.log[n][f]=v;save()}

/* ---------- 운영 기록 ---------- */
function runList(){return `<h1>운영 기록</h1><p class="sub">과정을 실제로 운영하는 집단(기수)을 만들고 출석·과제·관찰·사전사후 검사를 기록합니다. 자료는 이 컴퓨터의 이 브라우저에만 저장됩니다.</p>
  <div class="note">참여주민은 <b>사례관리번호(별칭)</b>로만 적습니다. 이름·주민번호·연락처는 넣지 마세요. 번호와 실제 인물의 대조표는 운영자가 따로 관리합니다.</div>
  <div class="card"><h3>새 집단 만들기</h3><div class="row"><select id="ngp">${G.programs.map(p=>`<option value="${p.no}">${String(p.no).padStart(2,'0')} ${esc(p.title)}</option>`).join('')}</select>
   <input id="ngn" placeholder="집단 이름 (예: 2027년 1기)"><input id="ngf" placeholder="진행자"><button onclick="addGroup()">만들기</button></div></div>
  ${S.groups.map(g=>{const p=P(g.prog);return `<a class="card" href="#/run/${g.id}"><b>${esc(g.name)}</b> <span class="chip">${String(p.no).padStart(2,'0')} ${esc(p.title)}</span><div class="sub">참여자 ${g.members.length}명 · 진행자 ${esc(g.facilitator||'-')}</div></a>`}).join('')||'<p class="sub">아직 만든 집단이 없습니다.</p>'}
  <p class="sub">기록을 넣으면 어떤 결과물이 나오는지 먼저 보려면 <a href="#/report/sample/1">견본 보고서</a>를 열어 보세요.</p>`}
function addGroup(){const n=$('#ngn').value.trim();if(!n){alert('집단 이름을 적어 주세요.');return}
  const g={id:uid(),prog:+$('#ngp').value,name:n,facilitator:$('#ngf').value.trim(),members:[],att:{},log:{},scores:{},done:{}};S.groups.push(g);S.cur=g.id;save();location.hash='#/run/'+g.id}
const ATT=['','○','△','×'];
function tot(p,q,i,arr){if(!arr)return null;const r=revOf(p,q,i);let t=0,c=0;q.items.forEach((it,k)=>{const v=+arr[k];if(v>=1&&v<=q.points){t+=r[k]?(q.points+1-v):v;c++}});return c===q.items.length?t:null}
function group(id,code){const g=S.groups.find(x=>x.id===id);if(!g)return'<p>없는 집단입니다.</p>';const p=P(g.prog);const Q=(p.evaluation||{}).quant||[];
  if(code)return member(g,p,decodeURIComponent(code));
  const rate=g.members.length?Math.round(100*g.members.reduce((a,m)=>a+p.sessions.filter(s=>((g.att[s.n]||{})[m.code]||{}).a==='○').length,0)/(g.members.length*p.sessions.length)):0;
  return `<p class="sub"><a href="#/run">운영 기록</a> ›</p><h1>${esc(g.name)}</h1><p class="sub">${String(p.no).padStart(2,'0')} ${esc(p.title)} · 진행자 ${esc(g.facilitator||'-')}</p>
  <div class="card"><h3>참여자 (사례관리번호)</h3><div class="row"><input id="nm" placeholder="사례관리번호 (예: G-2027-014)"><button onclick="addMember('${g.id}')">추가</button></div>
   <p>${g.members.map(m=>`<a class="chip" href="#/run/${g.id}/${encodeURIComponent(m.code)}">${esc(m.code)}</a>`).join('')||'<span class="sub">아직 없습니다.</span>'}</p><p class="sub">번호를 누르면 그 참여자의 출석·과제·관찰·검사 점수를 적습니다.</p></div>
  <div class="card"><h3>출석표 <span class="sub">출석률 ${rate}% · 칸을 누르면 ○(출석) → △(지각·조퇴) → ×(결석)</span></h3><div class="scroll"><table><tr><th>번호</th>${p.sessions.map(s=>`<th><a href="#/p/${p.no}/s/${s.n}">${s.n}회</a></th>`).join('')}<th>과제</th></tr>
   ${g.members.map(m=>`<tr><td><a href="#/run/${g.id}/${encodeURIComponent(m.code)}">${esc(m.code)}</a></td>${p.sessions.map(s=>`<td class="att" onclick="cycAtt('${g.id}',${s.n},'${esc(m.code)}')">${((g.att[s.n]||{})[m.code]||{}).a||'·'}</td>`).join('')}<td>${p.sessions.filter(s=>((g.att[s.n]||{})[m.code]||{}).hw).length}회</td></tr>`).join('')}
   <tr><th>진행일</th>${p.sessions.map(s=>`<td class="sub">${esc(((g.log[s.n]||{}).date||'').slice(5))}</td>`).join('')}<td></td></tr></table></div></div>
  ${Q.map((q,i)=>resultCard(g,p,q,i)).join('')}
  <div class="card"><h3>회기 운영 메모</h3>${p.sessions.map(s=>(g.log[s.n]||{}).memo?`<p><b>${s.n}회기</b> ${esc(g.log[s.n].memo)}</p>`:'').join('')||'<p class="sub">회기 진행판에서 적은 메모가 여기 모입니다.</p>'}</div>
  <p class="row"><a class="btn" href="#/report/${g.id}">집단 결과 보고서</a><button class="ghost" onclick="csv('${g.id}')">결과표 내려받기 (CSV)</button><button class="danger" onclick="delGroup('${g.id}')">이 집단 지우기</button></p>`}
function resultCard(g,p,q,i){const sc=(g.scores[i]||{});const rows=g.members.map(m=>{const a=tot(p,q,i,(sc[m.code]||{}).pre),b=tot(p,q,i,(sc[m.code]||{}).post);return{c:m.code,a,b}});
  const both=rows.filter(r=>r.a!=null&&r.b!=null);const avg=k=>both.length?(both.reduce((s,r)=>s+r[k],0)/both.length).toFixed(1):'-';const max=q.items.length*q.points;
  return `<div class="card"><h3>${esc(q.name)} — 사전·사후</h3>${revUnknown(p,q,i)?'<div class="note">역채점 문항이 확정되지 않아 단순 합계입니다. 점수 해석에 주의하세요.</div>':''}
  <div class="scroll"><table><tr><th>번호</th><th>사전</th><th>사후</th><th>변화</th><th style="width:40%">막대 (회색 사전 / 초록 사후, 만점 ${max})</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.c)}</td><td>${r.a??'-'}</td><td>${r.b??'-'}</td><td>${r.a!=null&&r.b!=null?(r.b-r.a>0?'+':'')+(r.b-r.a):'-'}</td><td>${r.a!=null?`<div class="bar pre" style="width:${100*r.a/max}%"></div>`:''}${r.b!=null?`<div class="bar" style="width:${100*r.b/max}%;margin-top:2px"></div>`:''}</td></tr>`).join('')}
  <tr><th>평균 (둘 다 한 ${both.length}명)</th><th>${avg('a')}</th><th>${avg('b')}</th><th>${both.length?((avg('b')-avg('a'))>0?'+':'')+(avg('b')-avg('a')).toFixed(1):'-'}</th><th>향상 ${both.filter(r=>r.b>r.a).length}명 · 같음 ${both.filter(r=>r.b===r.a).length}명 · 하락 ${both.filter(r=>r.b<r.a).length}명</th></tr></table></div>
  <p class="sub">점수가 높을수록 좋은지는 척도마다 다릅니다. 「평가 척도」의 채점·해석 안내를 함께 보세요.</p></div>`}
function addMember(id){const g=S.groups.find(x=>x.id===id);const c=$('#nm').value.trim();if(!c)return;if(g.members.some(m=>m.code===c)){alert('이미 있는 번호입니다.');return}
  if(/[가-힣]{2,4}$/.test(c)&&!/\d/.test(c)&&!confirm('이름처럼 보입니다. 사례관리번호(별칭)가 맞습니까?'))return;g.members.push({code:c});save();route()}
function cycAtt(id,n,c){const g=S.groups.find(x=>x.id===id);g.att[n]=g.att[n]||{};const o=g.att[n][c]=g.att[n][c]||{};o.a=ATT[(ATT.indexOf(o.a||'')+1)%ATT.length];save();route()}
function member(g,p,code){const Q=(p.evaluation||{}).quant||[];
  return `<p class="sub"><a href="#/run">운영 기록</a> › <a href="#/run/${g.id}">${esc(g.name)}</a> ›</p><h1>${esc(code)}</h1>
  <div class="card"><h3>회기별 기록</h3><div class="scroll"><table><tr><th>회기</th><th>출석</th><th>과제 실천</th><th>관찰 메모</th></tr>
  ${p.sessions.map(s=>{const o=((g.att[s.n]||{})[code]||{});return `<tr><td>${s.n}. ${esc(s.title)}</td><td><select onchange="setAtt('${g.id}',${s.n},'${esc(code)}','a',this.value)">${ATT.map(a=>`<option${o.a===a?' selected':''}>${a}</option>`).join('')}</select></td>
   <td><input type="checkbox" ${o.hw?'checked':''} onchange="setAtt('${g.id}',${s.n},'${esc(code)}','hw',this.checked)"></td><td><input style="width:100%;min-width:200px" value="${esc(o.memo||'')}" placeholder="참여 태도, 변화, 연계 필요 사항" onchange="setAtt('${g.id}',${s.n},'${esc(code)}','memo',this.value)"></td></tr>`}).join('')}</table></div></div>
  ${Q.map((q,i)=>{const sc=((g.scores[i]||{})[code]||{});return `<div class="card"><h3>${esc(q.name)}</h3><p class="sub">1~${q.points} 숫자로 입력 (${(q.labels||[]).map((l,k)=>(k+1)+'='+esc(l)).join(', ')}) · 사전 합계 <b id="t${i}a">${tot(p,q,i,sc.pre)??'-'}</b> · 사후 합계 <b id="t${i}b">${tot(p,q,i,sc.post)??'-'}</b></p>
   <div class="scroll"><table><tr><th>번호</th><th>문항</th><th>사전</th><th>사후</th></tr>${q.items.map((it,k)=>`<tr><td>${it.n}</td><td>${esc(it.text)}</td>
   <td><input class="num" type="number" min="1" max="${q.points}" value="${esc((sc.pre||[])[k]??'')}" onchange="setScore('${g.id}',${i},'${esc(code)}','pre',${k},this.value)"></td>
   <td><input class="num" type="number" min="1" max="${q.points}" value="${esc((sc.post||[])[k]??'')}" onchange="setScore('${g.id}',${i},'${esc(code)}','post',${k},this.value)"></td></tr>`).join('')}</table></div></div>`}).join('')}
  <p><button class="danger" onclick="delMember('${g.id}','${esc(code)}')">이 참여자 기록 지우기</button></p>`}
function setAtt(id,n,c,f,v){const g=S.groups.find(x=>x.id===id);g.att[n]=g.att[n]||{};(g.att[n][c]=g.att[n][c]||{})[f]=v;save()}
function setScore(id,i,c,w,k,v){const g=S.groups.find(x=>x.id===id),p=P(g.prog),q=p.evaluation.quant[i];g.scores[i]=g.scores[i]||{};const o=g.scores[i][c]=g.scores[i][c]||{};o[w]=o[w]||[];o[w][k]=v===''?null:+v;save();
  const e=$('#t'+i+(w==='pre'?'a':'b'));if(e)e.textContent=tot(p,q,i,o[w])??'-'}
function delMember(id,c){if(!confirm(c+' 의 기록을 모두 지웁니다. 되돌릴 수 없습니다.'))return;const g=S.groups.find(x=>x.id===id);g.members=g.members.filter(m=>m.code!==c);Object.values(g.att).forEach(a=>delete a[c]);Object.values(g.scores).forEach(a=>delete a[c]);save();location.hash='#/run/'+id}
function delGroup(id){const g=S.groups.find(x=>x.id===id);if(!confirm('「'+g.name+'」 집단의 기록을 모두 지웁니다. 되돌릴 수 없습니다.'))return;S.groups=S.groups.filter(x=>x.id!==id);save();location.hash='#/run'}
function down(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csv(id){const g=S.groups.find(x=>x.id===id),p=P(g.prog),Q=(p.evaluation||{}).quant||[];const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['사례관리번호',...p.sessions.map(s=>s.n+'회 출석'),'과제 실천 횟수',...Q.flatMap(q=>[q.name+' 사전',q.name+' 사후'])];
  const rows=g.members.map(m=>[m.code,...p.sessions.map(s=>((g.att[s.n]||{})[m.code]||{}).a||''),p.sessions.filter(s=>((g.att[s.n]||{})[m.code]||{}).hw).length,...Q.flatMap((q,i)=>[tot(p,q,i,((g.scores[i]||{})[m.code]||{}).pre),tot(p,q,i,((g.scores[i]||{})[m.code]||{}).post)])]);
  down(g.name+'_결과표.csv',[head,...rows].map(r=>r.map(c).join(',')).join('\r\n'),'text/csv')}

/* ---------- 집단 결과 보고서 ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const LOWGOOD=/스트레스|우울|불안|소진|분노/;
function sampleGroup(no){const p=P(no)||G.programs[0];const r=rng(p.no*977+13);const Q=(p.evaluation||{}).quant||[];
  const g={id:'sample',sample:true,prog:p.no,name:'견본 집단',facilitator:'견본',members:[],att:{},log:{},scores:{},done:{},
   summary:'견본 문장입니다. 진행자가 집단 전체의 변화, 잘된 점, 다음 기수에 고칠 점을 적는 자리입니다.',voices:'견본 문장입니다. 참여자가 남긴 소감을 번호 없이 옮겨 적는 자리입니다.'};
  for(let k=1;k<=8;k++)g.members.push({code:'견본-'+String(k).padStart(2,'0')});
  p.sessions.forEach((s,si)=>{const d=new Date(2027,2,2+7*si);g.log[s.n]={date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};g.att[s.n]={};

  ${show.map(r=>{const st=S.adm.st[r.it.id]||{};return `<div class="card"><div><span class="chip">${r.no?String(r.no).padStart(2,'0'):'책 전체'}</span><span class="chip ${PC[r.it.pri]||'p3'}">${esc(r.it.pri)}</span><span class="chip">${esc(r.it.cat)}</span> <b>${esc(r.it.title)}</b> <span class="sub">${esc(r.it.id)}</span></div>
    <p class="sub">${esc(r.it.ask)}</p>${r.as.map(x=>`<p><b>${esc(x.who)}</b> ${x.a.c?`<span class="chip">${esc(x.a.c)}</span>`:''} ${esc(x.a.t||'')}</p>`).join('')||'<p class="sub">답 없음</p>'}
    <div class="row"><select onchange="setAdm('${esc(r.it.id)}','s',this.value)">${AST.map(k=>`<option${(st.s||'미처리')===k?' selected':''}>${k}</option>`).join('')}</select><input style="flex:1;min-width:200px" placeholder="처리 내용·이유 (검수자에게 돌려줄 설명)" value="${esc(st.memo||'')}" onchange="setAdm('${esc(r.it.id)}','memo',this.value)"></div></div>`}).join('')||'<p class="sub">해당하는 항목이 없습니다.</p>'}
  ${F.some(x=>(x.reviews||[]).length)?`<h2>회기에 남긴 의견</h2>${F.flatMap(x=>(x.reviews||[]).map(r=>`<div class="card"><span class="chip">${String(r.prog).padStart(2,'0')} ${esc((P(r.prog)||{}).title)}${r.session?' · '+r.session+'회기':''}</span><b>${esc(x.me.name||'')}</b><p>${esc(r.text)}</p></div>`)).join('')}`:''}
  ${F.some(x=>Object.keys(x.rev||{}).length)?`<h2>역채점 표시</h2>${F.flatMap(x=>Object.keys(x.rev||{}).map(k=>{const [no,i]=k.split('-');const q=((P(no)||{}).evaluation||{quant:[]}).quant[i];if(!q)return'';const on=q.items.filter((it,j)=>x.rev[k][j]).map(it=>it.n);return `<div class="card"><b>${esc(x.me.name||'')}</b> · ${String(no).padStart(2,'0')} ${esc(q.name)}<p>거꾸로 채점: ${on.length?on.join(', ')+'번':'없음'}</p></div>`})).join('')}`:''}
  <div class="card"><h3>3. 결과 내려받기</h3><p class="row"><button onclick="adminCsv()">반영 현황표 내려받기 (CSV)</button><button class="ghost" onclick="adminJson()">종합 파일 내려받기 (도구 수정 요청용)</button></p>
   <p class="sub">반영 현황표는 검수자에게 돌려주는 답신으로, 종합 파일은 도구를 고칠 때 넘겨주는 자료로 씁니다.</p></div>`}
function delFile(i){S.adm.files.splice(i,1);save();route()}
function adminJson(){down('검수종합_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'jeongseo-admin',adm:S.adm},null,1),'application/json')}
function addFiles(fs){[...fs].forEach(f=>readJson(f,d=>{if(d.kind!=='jeongseo-review'){alert(f.name+' : 검수 답변 파일이 아닙니다.');return}S.adm.files=S.adm.files.filter(x=>!((x.me.name||'')===((d.me||{}).name||'')&&(x.me.center||'')===((d.me||{}).center||'')));S.adm.files.push({me:d.me||{},at:d.at,ans:d.ans||{},rev:d.rev||{},reviews:d.reviews||[]});save();route()}))}
function setAdm(id,f,v){(S.adm.st[id]=S.adm.st[id]||{})[f]=v;save()}
function adminCsv(){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const out=[['번호','과정','구분','중요도','제목','질문','검수자','고른 답','적은 내용','처리','처리 내용·이유']];
  [...G.programs.map(p=>p.no),0].forEach(no=>items(no).forEach(it=>{const st=S.adm.st[it.id]||{};const as=S.adm.files.map(x=>({w:x.me.name,a:(x.ans||{})[it.id]})).filter(x=>hasA(x.a));
   (as.length?as:[{w:'',a:{}}]).forEach(x=>out.push([it.id,no?PN(no).title:'책 전체',it.cat,it.pri,it.title,it.ask,x.w,x.a.c||'',x.a.t||'',as.length?(st.s||'미처리'):'답 없음',st.memo||'']))}));
  down('검수_반영현황_'+new Date().toISOString().slice(0,10)+'.csv',out.map(r=>r.map(c).join(',')).join('\r\n'),'text/csv')}
/* ---------- 구글 시트 자동 전달 ---------- */
const SHEET=G.sheet||'';const QS=new URLSearchParams(location.search);const GC=(QS.get('g')||'').trim();let K=(QS.get('k')||'').trim();if(!K&&GC)K=S.k||'';
const AUTO=()=>!!(SHEET&&(ON()||(GC&&!K)));
function join(){const n=(S.me.name||'').trim(),c=(S.me.center||'').trim();if(!n||!c){alert('이름과 소속 센터를 적어 주세요.');return}
  fetch(SHEET,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({join:GC,name:n,center:c,progs:S.me.progs||[],role:S.me.role||ROLES[0]})}).then(r=>r.json()).then(d=>{if(!d.ok){alert(d.err==='join'?'링크가 올바르지 않습니다. 받으신 주소를 끝까지 그대로 여셨는지 확인해 주세요.':'시작하지 못했습니다. 잠시 뒤 다시 눌러 주세요.');return}
    K=d.k;S.k=K;S.kok=true;S.me.role=S.me.role||ROLES[0];S.out=Object.keys(S.ans).filter(id=>hasA(S.ans[id])).map(id=>({t:'ans',id,c:S.ans[id].c||'',x:S.ans[id].t||'',at:S.ans[id].at||''})).concat([{t:'me',me:S.me}]);save();pull()}).catch(()=>alert('연결하지 못했습니다. 인터넷 연결을 확인해 주세요.'))}

let busy=false;
const ON=()=>!!(SHEET&&K&&S.kok);
function syncText(){const n=(S.out||[]).length;return SHEET&&GC&&!K?'이름과 소속을 적고 「시작하기」를 눌러 주세요':!SHEET||!K?'':S.kok===false?'링크를 확인해 주세요':busy?'보내는 중…':n?'아직 전달되지 않은 답 '+n+'개 (인터넷이 연결되면 다시 보냅니다)':S.kok?'모든 답이 담당자에게 전달됐습니다':'연결하는 중…'}
function showSync(){const t=syncText();const e=$('#sync');if(e)e.textContent=t.replace(/ \(.*/,'');const b=$('#syncBig');if(b)b.textContent=t}
function push(op){if(!SHEET||!K)return;S.out=(S.out||[]).concat([op]);save();flush()}
function saveMe(){save();push({t:'me',me:S.me})}
function flush(){if(!ON()||busy||!(S.out||[]).length){showSync();return}busy=true;showSync();const batch=S.out.slice();
  fetch(SHEET,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:K,ops:batch})}).then(r=>r.json()).then(d=>{if(!d.ok)throw 0;S.out=S.out.slice(batch.length);save();busy=false;showSync();if(S.out.length)flush()}).catch(()=>{busy=false;showSync()})}
function pull(){if(!SHEET||!K)return;
  if(S.k&&S.k!==K){S.me={};S.ans={};S.rev={};S.reviews=[];S.out=[];delete S.kok}S.k=K;save();showSync();
  fetch(SHEET+'?k='+encodeURIComponent(K)).then(r=>r.json()).then(d=>{if(!d.ok){S.kok=false;save();route();return}S.kok=true;const out=S.out||[];
    const pend=new Set(out.filter(o=>o.t==='ans').map(o=>o.id));Object.keys(d.ans||{}).forEach(id=>{if(!pend.has(id))S.ans[id]=d.ans[id]});
    S.me=out.some(o=>o.t==='me')?Object.assign({},d.me,S.me):Object.assign({},S.me,d.me);
    if(!out.some(o=>o.t==='rev')&&d.rev&&Object.keys(d.rev).length)S.rev=d.rev;
    if(!out.some(o=>o.t==='reviews')&&(d.reviews||[]).length)S.reviews=d.reviews;
    save();route();flush()}).catch(()=>showSync())}
window.addEventListener('online',flush);setInterval(flush,30000);
function sendCardOn(){return `<div class="card"><h3>답변 전달</h3><p><b id="syncBig"></b></p><p class="sub">답은 누르거나 적는 즉시 담당자의 구글 시트에 저장됩니다. 따로 보내실 것은 없고, 같은 링크로 다시 열면 다른 기기에서도 이어서 하실 수 있습니다. 참여주민의 실명은 적지 말아 주세요.</p>
  <p class="row"><button class="ghost" onclick="exportMine()">내 답변을 파일로도 받아 두기</button></p></div>`}
function admKey(v){try{if(v!==undefined)sessionStorage.setItem('jj-admin',v);return sessionStorage.getItem('jj-admin')||''}catch(e){return v||''}}
function sheetCard(){const L=S.adm.people||[];const base=location.href.split(/[?#]/)[0];
  return `<div class="card"><h3>시트에서 답변 가져오기</h3><p class="row"><button onclick="adminPull()">시트에서 지금 가져오기</button><span class="sub">${S.adm.pulled?'마지막으로 가져온 때 '+esc(S.adm.pulled):'검수자가 답하면 구글 시트에 바로 쌓입니다. 여기서 가져와 아래에서 항목별로 봅니다.'}</span></p>
  ${S.adm.join?`<p><b>모두에게 보내는 공통 링크</b></p><p><input readonly style="width:100%" value="${esc(base+'?g='+encodeURIComponent(S.adm.join))}" onclick="this.select()"></p><p class="sub">이 주소 하나를 검수자 모두에게 보냅니다. 각자 이름과 소속을 적고 시작하면 그분 몫으로 답이 쌓입니다.</p>`:''}
  ${L.length?`<div class="scroll"><table><tr><th>검수자</th><th>답하는 분</th><th>담당 과정</th><th>답한 항목</th><th>마지막 저장</th><th>개인별 링크 (이름을 적지 않고 바로 열게 하고 싶을 때만)</th></tr>${L.map(x=>`<tr><td>${esc(x.name)} <span class="sub">${esc(x.center)}</span></td><td>${esc(x.role||'')}</td><td>${esc((x.progs||[]).join(', '))}</td><td>${x.n}개</td><td>${esc(x.at||'-')}</td><td><input readonly style="width:100%;min-width:280px" value="${esc(base+'?k='+encodeURIComponent(x.k))}" onclick="this.select()"></td></tr>`).join('')}</table></div>`:'<p class="sub">아직 시작한 검수자가 없습니다.</p>'}</div>`}
function adminPull(){const key=admKey()||prompt('담당자 열쇠를 넣어 주세요. (구글 시트 메뉴 「검수 수집 › 담당자 열쇠 보기」)');if(!key)return;
  fetch(SHEET,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:key.trim()})}).then(r=>r.json()).then(d=>{if(!d.ok){admKey('');alert('열쇠가 맞지 않습니다.');return}admKey(key.trim());S.adm.people=d.people;S.adm.join=d.join||'';S.adm.files=S.adm.files.filter(x=>!x.k).concat(d.files);S.adm.pulled=new Date().toLocaleString('ko-KR');save();route()}).catch(()=>alert('시트에 연결하지 못했습니다. 인터넷 연결과 시트 주소를 확인해 주세요.'))}
if((K||GC)&&!location.hash)location.hash='#/review';
route();pull();
</script>
</body>
</html>
